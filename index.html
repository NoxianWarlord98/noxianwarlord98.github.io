<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HELIA_RECOVERY_PROTOCOL</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;500;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #020205; font-family: 'Vazirmatn', sans-serif; color: #fff; user-select: none; }

        /* پس‌زمینه نئونی ثابت */
        .glow-bg {
            position: fixed; width: 100%; height: 100%; top: 0; left: 0;
            background: radial-gradient(circle at 50% 50%, #1a0826 0%, #05020a 60%, #000000 100%);
            z-index: 0;
        }
        .nebula {
            position: fixed; width: 500px; height: 500px; border-radius: 50%;
            background: radial-gradient(circle, rgba(255,45,117,0.18) 0%, rgba(120,0,255,0.06) 50%, transparent 70%);
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            filter: blur(80px); animation: pulse-nebula 6s infinite alternate ease-in-out;
            pointer-events: none;
        }
        @keyframes pulse-nebula {
            0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.5; }
            100% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
        }

        /* کادر ترمینال */
        #terminal-screen {
            position: fixed; width: 100%; height: 100%; top: 0; left: 0;
            display: flex; justify-content: center; align-items: center;
            z-index: 3000; transition: opacity 0.8s ease, transform 0.8s ease;
        }
        .glass-card {
            width: 90%; max-width: 600px; background: rgba(18, 12, 28, 0.85);
            border: 1px solid rgba(255, 77, 109, 0.35); border-radius: 24px; padding: 30px 25px;
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 50px rgba(0,0,0,0.8), inset 0 0 20px rgba(255, 77, 109, 0.1);
            position: relative; overflow: hidden;
        }

        .term-header { font-family: monospace; font-size: 13px; color: #ff4d6d; letter-spacing: 1.5px; margin-bottom: 20px; direction: ltr; text-align: left; }
        #log-text { font-size: 15px; line-height: 1.9; color: #e2e8f0; min-height: 130px; font-weight: 300; }
        
        .highlight-err { color: #ff4d6d; font-weight: 700; }
        .highlight-ice { color: #38bdf8; font-weight: 700; }

        .btn-group { display: flex; gap: 15px; justify-content: center; align-items: center; margin-top: 25px; position: relative; width: 100%; height: 50px; }
        .action-btn {
            padding: 12px 30px; border-radius: 50px; border: none; font-family: 'Vazirmatn', sans-serif;
            font-size: 14px; font-weight: 700; cursor: pointer; transition: background 0.3s, transform 0.2s, box-shadow 0.3s;
        }
        #forgive-btn {
            background: linear-gradient(135deg, #ff4d6d 0%, #e11d48 100%); color: #fff;
            box-shadow: 0 8px 20px rgba(225, 29, 72, 0.4); z-index: 2;
        }
        #forgive-btn:hover { transform: scale(1.05); box-shadow: 0 12px 28px rgba(225, 29, 72, 0.7); }
        #refuse-btn {
            background: rgba(255,255,255,0.08); color: #94a3b8; border: 1px solid rgba(255,255,255,0.15);
            transition: transform 0.3s ease; position: relative;
        }

        /* فاز ۲: کارت دلجویی اصلی با قابلیت اسکرول داخلی */
        #recovery-screen {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1500;
        }
        #final-card {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.95);
            width: 90%; max-width: 620px; max-height: 85vh; background: rgba(12, 8, 20, 0.88);
            border: 1px solid rgba(255, 182, 193, 0.3); border-radius: 28px; padding: 35px 25px;
            backdrop-filter: blur(25px); box-shadow: 0 30px 70px rgba(0,0,0,0.9), 0 0 35px rgba(255, 77, 109, 0.2);
            text-align: center; opacity: 0; transition: opacity 1s ease, transform 1s ease;
            overflow-y: auto; /* اسکرول داخلی فقط برای کارت */
            -webkit-overflow-scrolling: touch;
        }
        #final-card::-webkit-scrollbar { width: 5px; }
        #final-card::-webkit-scrollbar-thumb { background: rgba(255, 77, 109, 0.4); border-radius: 10px; }

        #final-card.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

        .heart-badge {
            display: inline-block; font-size: 42px; margin-bottom: 15px;
            filter: drop-shadow(0 0 12px rgba(255,77,109,0.8)); animation: float-badge 3s infinite ease-in-out;
        }
        @keyframes float-badge { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

        #apology-text {
            font-size: 16px; line-height: 2.1; color: #f1f5f9; font-weight: 400;
            text-align: justify; direction: rtl; padding-bottom: 10px;
        }

        canvas#space-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
        
        .floating-element {
            position: fixed; bottom: -50px; font-size: 20px; animation: float-up linear infinite;
            pointer-events: none; filter: drop-shadow(0 0 6px rgba(255,255,255,0.4)); z-index: 2;
        }
        @keyframes float-up {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            15% { opacity: 0.85; }
            100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="glow-bg"></div>
    <div class="nebula"></div>
    <canvas id="space-canvas"></canvas>

    <!-- فاز ۱ -->
    <div id="terminal-screen">
        <div class="glass-card">
            <div class="term-header">> SYSTEM_CRITICAL_FAILURE // ICE_BLOCK_DETECTED</div>
            <div id="log-text">در حال اسکن رفتارهای اخیر...<br>شناسایی خطای بزرگ: <span class="highlight-ice">سنگِ یخی</span> بی‌احساس رفتار کرده و <span class="highlight-err">قلبِ شیشه‌ای هلی‌جان</span> آسیب دیده است. 💔<br>نتیجه: تمام خطاها ۱۰۰٪ متوجه خودِ سنگِ یخی است.</div>
            <div class="btn-group" id="btn-container" style="display: none;">
                <button class="action-btn" id="forgive-btn">ذوب کردن یخ‌ها و بخشش 🌸✨</button>
                <button class="action-btn" id="refuse-btn">نمی‌بخشم! 🧊</button>
            </div>
        </div>
    </div>

    <!-- فاز ۲ -->
    <div id="recovery-screen">
        <div id="final-card">
            <div class="heart-badge">💎🌸</div>
            <div id="apology-text"></div>
        </div>
    </div>

    <script>
        const refuseBtn = document.getElementById('refuse-btn');
        const forgiveBtn = document.getElementById('forgive-btn');

        const apologyMessage = `هلیـا جانم... ✨\n\nراستش رو بخوای هیچ توجیهی برای رفتارهام ندارم و کاملاً قبول دارم که زدم همه‌چیز رو خراب کردم! تو درست می‌گفتی؛ قلب تو مثل شیشه صاف و مهربون بود و من مثل یه سنگِ یخیِ بی‌احساس رفتار کردم و باعث شدم اون قلب قشنگت ترک برداره... 🧊💔\n\nقبول دارم که گاهی وقت‌ها چنان رفتارهایی می‌کنم که خودِ یخچالم جلوش کم می‌اره! ولی باور کن تمام این سنگ‌بودن‌ها به این دلیل نیست که واسم مهم نیستی، توی این دنیا تو واسه من باارزش‌ترین و عزیزترین آدمی.\n\nاین صفحه رو ساختم که از تهِ دل ازت معذرت خواهی کنم🌸\n\nهیچ بازی و هیچ اتفاقی توی این دنیا ارزشِ این رو نداشت که من دلِ تو رو بشکونم تمام تلاشم رو می‌کنم که اون سنگِ یخی رو آب کنم و دیگه خرابکاری نکنم.\n\nاین سنگِ یخی رو بابت تمام اشتباهاتش ببخش؛ من همیشه منتظرت می‌مونم تا برگردی. 💖\n\n— از طرفِ سنگِ یخیِ پشیمون 🧊💎`;

        function runDiagnostic() {
            setTimeout(() => {
                document.getElementById('log-text').innerHTML += "<br><span style='color:#fb7185;'>[!] هیچ عذر موجهی وجود ندارد. سنگِ یخی کاملاً مقصر است.</span>";
                setTimeout(() => {
                    document.getElementById('log-text').innerHTML += "<br><span style='color:#38bdf8;'>[+] آیا اجازه می‌دهید سنگِ یخی دلتان را به دست آورد؟</span>";
                    document.getElementById('btn-container').style.display = 'flex';
                }, 1000);
            }, 1200);
        }
        runDiagnostic();

        refuseBtn.addEventListener('mouseenter', () => {
            const container = document.getElementById('btn-container');
            const maxX = (container.clientWidth / 2) - 50;
            const randomX = (Math.random() - 0.5) * maxX * 2;
            refuseBtn.style.transform = `translateX(${randomX}px)`;
        });
        
        refuseBtn.addEventListener('click', () => {
            alert('این گزینه کار نمی‌کند! سنگِ یخی راهی جز بخشیده شدن ندارد 😊🌸');
        });

        forgiveBtn.addEventListener('click', () => {
            document.getElementById('terminal-screen').style.opacity = '0';
            document.getElementById('terminal-screen').style.transform = 'scale(0.95)';
            setTimeout(() => {
                document.getElementById('terminal-screen').style.display = 'none';
                document.getElementById('recovery-screen').style.display = 'block';
                setTimeout(() => {
                    document.getElementById('final-card').classList.add('show');
                    startTypewriter();
                }, 50);
            }, 800);
        });

        function startTypewriter() {
            const container = document.getElementById('apology-text');
            let i = 0;
            function type() {
                if (i < apologyMessage.length) {
                    container.innerHTML += apologyMessage.charAt(i) === '\n' ? '<br>' : apologyMessage.charAt(i);
                    i++;
                    setTimeout(type, 35);
                }
            }
            type();
        }

        const canvas = document.getElementById('space-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particles = [];
        for(let i=0; i<150; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2 + 0.5,
                vx: (Math.random() - 0.5) * 0.3,
                vy: (Math.random() - 0.5) * 0.3,
                alpha: Math.random() * 0.8 + 0.2
            });
        }

        function renderSpace() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.x += p.vx; p.y += p.vy;
                if(p.x<0 || p.x>canvas.width) p.vx*=-1;
                if(p.y<0 || p.y>canvas.height) p.vy*=-1;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
                ctx.fillStyle = `rgba(255, 182, 193, ${p.alpha})`;
                ctx.fill();
            });
            requestAnimationFrame(renderSpace);
        }
        renderSpace();

        setInterval(() => {
            const el = document.createElement('div');
            el.className = 'floating-element';
            el.innerText = ['🌸', '💎', '🧊', '✨', '🤍', '💖'][Math.floor(Math.random()*6)];
            el.style.left = Math.random() * 95 + 'vw';
            el.style.animationDuration = (Math.random() * 4 + 6) + 's';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 10000);
        }, 600);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
